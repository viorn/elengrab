{{- define "playlist-import-dialog" }}
<dialog class="modal-dialog playlist-import-dialog" id="playlist-import-dialog">
  <div class="modal-dialog__content">
    <header class="modal-dialog__header">
      <div class="modal-dialog__brand">
        <h2 class="modal-dialog__title" id="playlist-import-title">Playlist</h2>
      </div>

      <button class="modal-dialog__close" type="button" aria-label="Close" data-dialog-close>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="modal-dialog__body">
      <div class="playlist-import-dialog__summary" id="playlist-import-summary"></div>

      <label class="playlist-import-dialog__field">
        <span class="playlist-import-dialog__label">Add to playlist</span>
        <select class="playlist-import-dialog__select" id="playlist-import-target"></select>
      </label>

      <label class="playlist-import-dialog__field">
        <span class="playlist-import-dialog__label">Number of videos</span>
        <input class="playlist-import-dialog__input" id="playlist-import-limit" type="number" min="1" value="50">
      </label>

      <div class="playlist-import-dialog__items" id="playlist-import-items"></div>
    </div>

    <footer class="modal-dialog__footer">
      <button class="modal-dialog__button" type="button" data-dialog-close>Cancel</button>
      <button class="modal-dialog__button" type="button" id="playlist-import-only-one">Only this video</button>
      <button class="modal-dialog__button" type="button" id="playlist-import-submit">Download</button>
    </footer>
  </div>
</dialog>
{{- end }}
