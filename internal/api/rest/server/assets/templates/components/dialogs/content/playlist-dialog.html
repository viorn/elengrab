{{- define "playlist-dialog-content" }}
  {{- with .Values.PlaylistDialog }}
  <header class="modal-dialog__header">
    <div class="modal-dialog__brand">
      <span class="modal-dialog__logo" aria-hidden="true">{{ .LogoIcon }}</span>
      <h2 class="modal-dialog__title" id="playlist-dialog-title">Add to playlist</h2>
    </div>

    <button class="modal-dialog__close" type="button" aria-label="Close" data-dialog-close>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </header>

  <div class="modal-dialog__body">
    <div class="playlist-dialog__list" id="playlist-dialog-list"
         data-download-id="{{ .DownloadID }}"
         data-toggle-url="{{ .ToggleURL }}">
      {{- if .HasPlaylists }}
        {{- range .Playlists }}
        <label class="playlist-dialog__item" data-playlist-id="{{ .EncodedPlaylistID }}">
          <input type="checkbox" class="playlist-dialog__checkbox" aria-label="{{ .Title }}"
                 {{- if .Checked }} checked{{ end }}
                 {{- if not .CanEdit }} disabled{{ end }}>
          <span class="playlist-dialog__item-title">{{ .Title }}</span>
          <span class="playlist-dialog__item-count">{{ .ItemsCount }}</span>
        </label>
        {{- end }}
      {{- else }}
        <div class="playlist-dialog__empty" id="playlist-dialog-empty">No playlists yet</div>
      {{- end }}
    </div>

    {{- if .CanCreate }}
    <div class="playlist-dialog__create">
      <input class="playlist-dialog__create-input" type="text" id="playlist-dialog-create-input"
             placeholder="New playlist name" maxlength="100" autocomplete="off">
      <button class="modal-dialog__button" type="button" id="playlist-dialog-create-button"
              data-create-url="{{ .CreateURL }}">Create</button>
    </div>
    {{- end }}
  </div>
  {{- end }}
{{- end }}
